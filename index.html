<!-- Firebase SDK Modular (Phiên bản đã tối ưu & sửa lỗi) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signInWithRedirect, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            query, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // =========================================================================
        // BÁC SĨ THAY CẤU HÌNH FIREBASE CỦA BẠN VÀO DƯỚI ĐÂY (GIỮ NGUYÊN MÃ CỦA BẠN)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Khởi tạo Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' }); // Ép buộc chọn tài khoản khi bấm đăng nhập

        let currentUser = null;

        // 1. Xử lý Đăng Nhập Gmail (Kết hợp Popup và Chuyển hướng nếu trình duyệt chặn Popup)
        window.loginWithGoogle = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.warn("Popup bị chặn hoặc lỗi, đang chuyển sang chế độ Chuyển hướng (Redirect)...", error);
                try {
                    await signInWithRedirect(auth, provider);
                } catch (err) {
                    alert("Không thể đăng nhập Gmail. Vui lòng kiểm tra lại cấu hình Authorized Domains trên Firebase Console!");
                    console.error("Lỗi đăng nhập chi tiết:", err);
                }
            }
        };

        // 2. Đăng xuất
        window.logoutGoogle = function() {
            signOut(auth).then(() => {
                alert("Đã đăng xuất tài khoản!");
            }).catch((err) => {
                console.error("Lỗi khi đăng xuất:", err);
            });
        };

        // 3. Theo dõi trạng thái đăng nhập Realtime
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('googleSignInBtn')?.classList.add('hidden');
                document.getElementById('doctorProfile')?.classList.remove('hidden');
                
                if (document.getElementById('docName')) document.getElementById('docName').innerText = user.displayName || "Bác sĩ";
                if (document.getElementById('docEmail')) document.getElementById('docEmail').innerText = user.email;
                if (document.getElementById('docAvatar')) document.getElementById('docAvatar').src = user.photoURL || "https://placehold.co/100x100/0d9488/ffffff?text=Doctor";
                
                // Tải danh sách bệnh nhân từ Firebase khi đã đăng nhập
                loadPatientsRealtime();
            } else {
                currentUser = null;
                document.getElementById('googleSignInBtn')?.classList.remove('hidden');
                document.getElementById('doctorProfile')?.classList.add('hidden');
                
                const tbody = document.getElementById('allPatientsTableBody');
                if (tbody) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400 font-medium">Vui lòng đăng nhập Gmail để tải và lưu dữ liệu bệnh nhân...</td></tr>`;
                }
            }
        });

        // 4. Tải dữ liệu bệnh nhân Realtime từ Firestore Database
        function loadPatientsRealtime() {
            const tbody = document.getElementById('allPatientsTableBody');
            if (!tbody) return;

            try {
                // Tải danh sách sắp xếp theo thời gian tạo mới nhất
                const q = query(collection(db, "patients"));
                
                onSnapshot(q, (snapshot) => {
                    tbody.innerHTML = '';
                    const badge = document.getElementById('patientCountBadge');
                    if (badge) badge.innerText = `${snapshot.docs.length} Bệnh nhân`;

                    if (snapshot.empty) {
                        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Chưa có dữ liệu bệnh nhân nào trên Đám mây. Bấm "Thêm Bệnh Nhân Mới" để bắt đầu lưu trữ!</td></tr>`;
                        return;
                    }

                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-teal-50/50 transition border-b border-slate-100";
                        tr.innerHTML = `
                            <td class="p-3 font-bold text-teal-800">${data.patientId || 'N/A'}</td>
                            <td class="p-3 font-bold text-slate-800">${data.name || 'N/A'}</td>
                            <td class="p-3 text-slate-600">${data.gender || 'N/A'}</td>
                            <td class="p-3 text-slate-700 font-medium">${data.diagnosis || 'N/A'}</td>
                            <td class="p-3 font-bold text-amber-700">${data.protocol || 'Chưa xếp'}</td>
                            <td class="p-3 text-slate-400 text-[11px]">${data.createdBy || 'Unknown'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }, (error) => {
                    console.error("Lỗi khi đọc dữ liệu Firestore:", error);
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-rose-500 font-semibold">Lỗi tải dữ liệu: Bác sĩ cần mở quyền Rules trong Firestore Database!</td></tr>`;
                });
            } catch (err) {
                console.error("Lỗi kết nối Firestore:", err);
            }
        }

        // 5. Lưu hồ sơ bệnh nhân lên Firebase Cloud
        window.savePatientToFirebase = async function(e) {
            e.preventDefault();
            
            if (!currentUser) {
                alert("Bác sĩ vui lòng bấm 'Đăng Nhập Gmail' trước khi nhập và lưu thông tin bệnh nhân!");
                return;
            }

            const pId = document.getElementById('npId')?.value.trim().toUpperCase();
            const pName = document.getElementById('npName')?.value.trim();
            const pDiag = document.getElementById('npDiagnosis')?.value.trim();
            const pProto = document.getElementById('npProtocol')?.value.trim();

            if (!pId || !pName) {
                alert("Vui lòng điền đầy đủ Mã Bệnh Nhân và Họ Tên!");
                return;
            }

            try {
                // Đẩy dữ liệu trực tiếp lên bộ sưu tập "patients" trong Firestore
                await addDoc(collection(db, "patients"), {
                    patientId: pId,
                    name: pName,
                    diagnosis: pDiag || "Chưa có chẩn đoán",
                    protocol: pProto || "Chưa chỉ định",
                    createdBy: currentUser.email,
                    createdAt: serverTimestamp()
                });

                // Đóng Modal và thông báo
                if (typeof window.closeNewPatientModal === 'function') {
                    window.closeNewPatientModal();
                } else {
                    document.getElementById('newPatientModal')?.classList.add('hidden');
                }
                
                alert(`Đã lưu thành công bệnh nhân ${pName} (${pId}) lên Cơ sở dữ liệu Cloud!`);
            } catch (err) {
                console.error("Lỗi khi lưu bệnh nhân vào Firestore:", err);
                alert("Không thể lưu dữ liệu! Nguyên nhân có thể do chưa bật Rule cho phép Ghi (Write) trong Firestore.");
            }
        };

        window.openNewPatientModal = () => document.getElementById('newPatientModal')?.classList.remove('hidden');
        window.closeNewPatientModal = () => document.getElementById('newPatientModal')?.classList.add('hidden');
    </script>
